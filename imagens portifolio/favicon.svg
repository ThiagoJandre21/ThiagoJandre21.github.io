<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- code bracket accents -->
  <text x="6" y="24" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="url(#accent)">&lt;</text>
  <text x="48" y="56" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="url(#accent)">/&gt;</text>

  <!-- initials -->
  <text x="32" y="41" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#fef9c3" text-anchor="middle">TJ</text>
